# ./src:/var/www/html Macのソースコードをコンテナへ共有する。
# mysql-data Docker管理のボリュームへDBを保存する。
# depends_on MySQLの接続確認が通ってからappを起動する。
# 同じCompose内のコンテナは、mysqlやappというサービス名で接続する
# MySQLのMac側ポートを3307にして、既存環境の3306との衝突を避けている。


services:
  app:
    build:
      context: ./docker
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:26.7.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./src:/var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  mysql-data:
